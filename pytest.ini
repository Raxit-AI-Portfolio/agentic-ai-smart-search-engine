[pytest]
asyncio_mode = auto
# agentic_core's services (sql_service, api_service, ...) cache connection
# pools/clients at module scope, bound to whatever event loop created them.
# pytest-asyncio's default "function" loop scope tears down and recreates the
# event loop per test, so a pool cached by test 1 breaks when test 2 (a new
# loop) tries to reuse it. Session-scoped keeps one loop for the whole run.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
